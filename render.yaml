services:
  - type: web
    name: alkitab-teman-hati
    env: python
    plan: free
    buildCommand: ./scripts/render_build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
