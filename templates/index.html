<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alkitab Teman Hati</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --card: rgba(15, 23, 42, 0.72);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #22d3ee;
        --primary2: #60a5fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top right, #1d4ed8 0%, transparent 45%),
                    radial-gradient(circle at left, #0ea5e9 0%, transparent 40%),
                    linear-gradient(140deg, var(--bg1), var(--bg2));
      }
      .container {
        max-width: 940px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .hero {
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.16), rgba(96, 165, 250, 0.12));
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
      }
      h1 { margin: 0 0 8px; font-size: 2rem; }
      p { color: var(--muted); }
      .chat {
        margin-top: 20px;
        display: grid;
        gap: 16px;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: var(--card);
        color: var(--text);
        padding: 14px;
        font-size: 1rem;
        outline: none;
      }
      textarea:focus { border-color: var(--primary); }
      button {
        border: none;
        background: linear-gradient(90deg, var(--primary), var(--primary2));
        color: #082f49;
        font-weight: 700;
        border-radius: 12px;
        padding: 12px 18px;
        cursor: pointer;
      }
      .card {
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: var(--card);
        border-radius: 16px;
        padding: 18px;
      }
      .verse { margin: 10px 0; }
      .verse .ref { color: #67e8f9; font-weight: 600; }
      .small { font-size: 0.9rem; color: var(--muted); }
      .warning {
        margin-top: 14px;
        border-left: 3px solid #f59e0b;
        padding-left: 10px;
      }
      @media (max-width: 640px) {
        h1 { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <h1>Alkitab Teman Hati</h1>
        <p>Curhat singkatmu akan dibalas dengan refleksi empatik + ayat rekomendasi + rencana baca personal.</p>

        <div class="chat">
          <textarea id="message" placeholder="Contoh: Aku lagi cemas soal masa depan dan keputusan kerja."></textarea>
          <div>
            <button id="sendBtn">Kirim Curhat</button>
          </div>
        </div>
      </div>

      <div id="result" class="card" style="display:none; margin-top:16px;"></div>
    </div>

    <script>
      const btn = document.getElementById('sendBtn');
      const msg = document.getElementById('message');
      const result = document.getElementById('result');

      function renderResponse(data) {
        const verses = data.recommended_verses
          .map(v => `<div class="verse"><div class="ref">${v.reference}</div><div>${v.text}</div></div>`)
          .join('');
        const plan = data.reading_plan.map(item => `<li>${item}</li>`).join('');

        result.innerHTML = `
          <h3>Refleksi</h3>
          <p>${data.reflection}</p>
          <h3>Ayat Rekomendasi</h3>
          ${verses}
          <h3>Rencana Baca</h3>
          <ol>${plan}</ol>
          <p class="small warning">${data.disclaimer}</p>
        `;
        result.style.display = 'block';
      }

      btn.addEventListener('click', async () => {
        const message = msg.value.trim();
        if (!message) return;

        btn.disabled = true;
        btn.textContent = 'Memproses...';

        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: 'web-user', message })
          });
          const data = await res.json();
          renderResponse(data);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Kirim Curhat';
        }
      });
    </script>
  </body>
</html>
